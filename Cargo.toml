[package]
name = "voxwaver"
version = "0.1.0"
edition = "2021"
description = "fishaudio/s1-mini TTS inference CLI in Rust with candle"
license = "CC-BY-NC-SA-4.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3"
rand = "0.8"
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.13"
base64 = "0.22"

# candle: fork branch carrying the Metal large-buffer pooling fix
# (huggingface/candle#4012), the direct Metal conv1d kernel, and the
# MLX-ported multi-block arg-sort wiring for ncols > 1024.
candle-core = { git = "https://github.com/adamswanglin/candle.git", branch = "voxwaver" }
candle-nn = { git = "https://github.com/adamswanglin/candle.git", branch = "voxwaver" }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
cudnn = ["cuda", "candle-core/cudnn", "candle-nn/cudnn"]
metal = ["candle-core/metal", "candle-nn/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]

[profile.release]
lto = "thin"
