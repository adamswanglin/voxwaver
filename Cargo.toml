[workspace]
members = ["crates/omnivoice", "crates/tts-common", "app/src-tauri"]
resolver = "2"

[profile.release]
lto = "thin"
strip = true

# Temporary local override while iterating on the conv1d kernel work:
# use the ../candle checkout (branch voxwaver) instead of the git URL.
[patch."https://github.com/adamswanglin/candle.git"]
candle-core = { path = "../candle/candle-core" }
candle-nn = { path = "../candle/candle-nn" }
