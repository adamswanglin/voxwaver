# VoxWeaver cross-platform desktop builds (Linux / macOS / Windows).
#
# Products per platform (see tauri.conf.json bundle targets):
#   macOS   -> .dmg (Metal acceleration, arm64 runner)
#   Windows -> NSIS .exe installer (CUDA acceleration, CPU fallback)
#   Linux   -> .AppImage + .deb (CUDA acceleration, CPU fallback)
#
# Triggers:
#   - push of a v* tag -> builds and publishes a GitHub release with installers
#   - workflow_dispatch -> build only, installers kept as workflow artifacts
#
# PREREQUISITE: the root Cargo.toml overrides candle with a local checkout
# ([patch."https://github.com/adamswanglin/candle.git"] -> ../candle), so the
# adamswanglin/candle fork (branch `voxwaver`) is checked out as a sibling
# directory below. That branch MUST contain the dynamic-loading cudarc change
# and the dummy_metal_backend fix, otherwise every build here fails to
# compile and CUDA builds would hard-link against the CUDA toolkit again.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the AppImage/deb compatible with older glibc systems
          - platform: linux
            os: ubuntu-22.04
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout voxwaver
        uses: actions/checkout@v4

      # Sibling checkout satisfying the [patch] path override in the root
      # Cargo.toml ("../candle/candle-core" / "../candle/candle-nn").
      # actions/checkout refuses paths outside GITHUB_WORKSPACE ("Repository
      # path ... is not under ..."), so clone the fork manually instead;
      # plain git has no such restriction. Anonymous clone works because the
      # fork is public (no token needed).
      - name: Clone candle fork (branch voxwaver)
        shell: bash
        run: |
          git clone --depth 1 --branch voxwaver \
            https://github.com/adamswanglin/candle.git ../candle

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install Linux system dependencies (Tauri + AppImage)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      # candle's cudarc is built with cuda-version-from-build-system + dynamic
      # loading: build.rs probes `nvcc --version` to select bindings, so a CUDA
      # toolkit must be present at BUILD time even though nothing links
      # against it (libraries are dlopened at RUNTIME, GPU not required).
      - name: Install CUDA toolkit (Linux)
        if: matrix.platform == 'linux'
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: "12.9.0"

      # nvcc on Windows requires the MSVC environment (cl.exe on PATH,
      # INCLUDE/LIB set) when the build scripts invoke it.
      - name: Set up MSVC environment (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA toolkit (Windows)
        if: matrix.platform == 'windows'
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: "12.9.0"
      - name: Set up CUDA library paths (Linux)
        if: matrix.platform == 'linux'
        run: |
          echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/usr/local/cuda/lib64:$LIBRARY_PATH" >> $GITHUB_ENV

      - name: Set up CUDA library paths (Windows)
        if: matrix.platform == 'windows'
        run: |
          echo "LIB=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9\lib\x64;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build and bundle VoxWeaver
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI runners have no GPU, so cudaforge's nvidia-smi probe fails and
          # the candle-kernels build script aborts. Pick the arch explicitly:
          # PTX is embedded (driver-JITed forward-compatible), and 80 (Ampere)
          # matches the fallback candle-kernels itself uses for the moe lib.
          # Single value only — cudaforge's GpuArch::parse rejects lists.
          # Consumed only on the Linux/Windows CUDA builds; unused on macOS.
          CUDA_COMPUTE_CAP: "80"
        with:
          projectPath: app
          # Release upload only for tag pushes; dispatched builds keep the
          # installers as workflow artifacts (empty tagName skips the release).
          tagName: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
          releaseName: "${{ startsWith(github.ref, 'refs/tags/') && format('VoxWeaver {0}', github.ref_name) || '' }}"
          releaseDraft: false
          prerelease: false

      # tauri-action's artifactPaths output is a JSON.stringify()'ed array
      # (["/abs/path", ...]), which upload-artifact cannot parse — it treats
      # the whole string as one literal path and finds nothing. List the
      # bundle outputs directly instead. The cargo target dir sits at the
      # repo root (root Cargo.toml is the workspace root), and non-matching
      # platform globs are simply ignored by upload-artifact.
      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxweaver-${{ matrix.platform }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error
