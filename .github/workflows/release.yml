# VoxWeaver cross-platform desktop builds (Linux / macOS / Windows).
#
# Products per platform (see tauri.conf.json bundle targets):
#   macOS   -> .dmg (Metal acceleration, arm64 runner)
#   Windows -> NSIS .exe installer (CUDA acceleration, CPU fallback)
#   Linux   -> .AppImage + .deb (CUDA acceleration, CPU fallback)
#
# Triggers:
#   - push of a v* tag -> builds and publishes a GitHub release with installers
#   - workflow_dispatch -> build only, installers kept as workflow artifacts
#
# PREREQUISITE: the root Cargo.toml overrides candle with a local checkout
# ([patch."https://github.com/adamswanglin/candle.git"] -> ../candle), so the
# adamswanglin/candle fork (branch `voxwaver`) is checked out as a sibling
# directory below. That branch MUST contain the dynamic-loading cudarc change
# and the dummy_metal_backend fix, otherwise every build here fails to
# compile and CUDA builds would hard-link against the CUDA toolkit again.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the AppImage/deb compatible with older glibc systems
          - platform: linux
            os: ubuntu-22.04
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout voxwaver
        uses: actions/checkout@v4

      # Sibling checkout satisfying the [patch] path override in the root
      # Cargo.toml ("../candle/candle-core" / "../candle/candle-nn").
      - name: Checkout candle fork (branch voxwaver)
        uses: actions/checkout@v4
        with:
          repository: adamswanglin/candle
          ref: voxwaver
          path: ../candle

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install Linux system dependencies (Tauri + AppImage)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      # candle's cudarc is built with cuda-version-from-build-system + dynamic
      # loading: build.rs probes `nvcc --version` to select bindings, so a CUDA
      # toolkit must be present at BUILD time even though nothing links
      # against it (libraries are dlopened at RUNTIME, GPU not required).
      - name: Install CUDA toolkit (Linux)
        if: matrix.platform == 'linux'
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: "12.6"

      # nvcc on Windows requires the MSVC environment (cl.exe on PATH,
      # INCLUDE/LIB set) when the build scripts invoke it.
      - name: Set up MSVC environment (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA toolkit (Windows)
        if: matrix.platform == 'windows'
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: "12.6"

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build and bundle VoxWeaver
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          # Release upload only for tag pushes; dispatched builds keep the
          # installers as workflow artifacts (empty tagName skips the release).
          tagName: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
          releaseName: "${{ startsWith(github.ref, 'refs/tags/') && format('VoxWeaver {0}', github.ref_name) || '' }}"
          releaseDraft: false
          prerelease: false

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxweaver-${{ matrix.platform }}
          path: ${{ steps.tauri.outputs.artifactPaths }}
          if-no-files-found: error
